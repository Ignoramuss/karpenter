# Session profile (docs/research/PLAN.md, Phase 4): Tier A at 50, 200 and 1,000 nodes, 10 evaluation seeds per cell
# (101-110; the pilot calibrated on 1-5). lambda, t0 and the eviction budgets were fixed from the pilot by rules
# committed before the calibration cells were inspected (experiments/PILOT.md, experiments/PREREGISTRATION.md).
# Groups run in the preregistered order:
#
#   for g in exp1-n200 exp1-baselines-n200 exp1-n1000 exp6 exp6-baselines exp6-b5 exp5 exp5-steered exp3 exp4 \
#            exp7-n50 exp7-b2 abl exp8 exp8-b5 b4 realism-w5 realism-w6 exp7-b2-n1000 exp1-baselines-n1000; do
#     until bin/csim matrix --matrix experiments/matrix/session.yaml --only $g --workers 4 --max-wall 60m \
#         | grep -q ' 0 pending'; do :; done
#   done   # bin/csim: built once with go build -o at the Gate 3 commit (experiments/session-binary.txt)
#
# Groups appear in this file in run order. Cut order if time runs short (fixed by the plan): the 1,000-node groups
# outside Exp 1 first (exp1-baselines-n1000, then exp7-b2-n1000), then W6 (realism-w6), then W5 (realism-w5); a cut
# group is dropped whole. Exp 1's own groups are never cut, and no configuration runs with fewer than 10 seeds.
name: session
outDir: experiments/runs/session
definitions:
  seeds: &seeds {from: 101, to: 110}
  # Anchors are split so no arm overrides a merged key (the YAML decoder rejects that).
  search: &search
    movesMode: pooled
    search: {maxFullSimulations: 16, maxAttempts: 500}
  std: &std
    executor: {name: shift-evict}
    potential: {name: util-entropy}
  common: &common {<<: [*search, *std]}
  heuristic: &heuristic
    candidates: {name: upstream}
    moves: [{name: upstream-multi, params: {mode: fine}}, {name: upstream-single, params: {mode: fine}}]
  random-candidates: &random-candidates
    candidates: {name: uniform-random, params: {sourceFraction: 0.25}}
  random: &random
    <<: *random-candidates
    moves: [{name: random-merge, params: {confirm: true}}, {name: random-shift}]
  # Planners at the pilot-calibrated weights and schedule (experiments/PILOT.md): lambda 0.1, t0 1.
  p0: &p0 {name: savings-only}
  p1: &p1 {name: entropy-greedy, params: {lambda: 0.1}}
  p2: &p2 {name: anneal-plan, params: {lambda: 0.1, t0: 1, cooling: 0.98, temperatureUnit: per-node}}
  # Exp 1's six cells: generation {heuristic, random} x planner {P0, P1, P2}, equal full-simulation budget.
  exp1-arms: &exp1-arms
    - {name: pipeline, label: heuristic/savings-only, pipeline: {<<: [*common, *heuristic], planner: *p0}}
    - {name: pipeline, label: heuristic/entropy-greedy, pipeline: {<<: [*common, *heuristic], planner: *p1}}
    - {name: pipeline, label: heuristic/anneal-plan, pipeline: {<<: [*common, *heuristic], planner: *p2}}
    - {name: pipeline, label: random/savings-only, pipeline: {<<: [*common, *random], planner: *p0}}
    - {name: pipeline, label: random/entropy-greedy, pipeline: {<<: [*common, *random], planner: *p1}}
    - {name: pipeline, label: random/anneal-plan, pipeline: {<<: [*common, *random], planner: *p2}}
  b4-pipeline: &b4-pipeline
    candidates: {name: upstream}
    moves: [{name: upstream-multi, params: {mode: fine}}, {name: upstream-single, params: {mode: fine}}]
    movesMode: sequential
    planner: {name: upstream}
    executor: {name: upstream-queue}
    potential: {name: none}
  b2: &b2 {name: B2-when-empty-or-underutilized, label: B2}
  b3: &b3 {name: B3-balanced, label: B3}
  b0: &b0 {name: B0-none, label: B0}
  b5: &b5 {name: B5-descheduler, label: B5}
  random-p1: &random-p1 {name: pipeline, label: random/entropy-greedy, pipeline: {<<: [*common, *random], planner: *p1}}
  heuristic-p1: &heuristic-p1 {name: pipeline, label: heuristic/entropy-greedy, pipeline: {<<: [*common, *heuristic], planner: *p1}}
  # Pod-eviction budget for Exp 3 and the ablations (pilot: the median per-minute eviction rate of random/entropy-greedy
  # while it consolidates, so the budget binds), and twice that.
  budget-lo: &budget-lo {podEvictionsPerMinute: 18}
  budget-hi: &budget-hi {podEvictionsPerMinute: 36}
base:
  duration: 3h
  # No per-cell wall-time limit: a 1,000-node B2 or B3 cell takes hours, and a limit would invalidate those arms
  # selectively. The runner's --max-wall only bounds how long it keeps launching cells.
  maxWall: 0s
  scenario: {nodes: 200}
groups:
  # --- Exp 1 (H1): random vs heuristic generation under three planners ----------------------------------------
  - name: exp1-n200
    vary: {scenario.name: [W1, W2, W4], arm: *exp1-arms, seed: *seeds}
  - name: exp1-baselines-n200
    vary: {scenario.name: [W1, W2, W4], arm: [*b2, *b3], seed: *seeds}
  - name: exp1-n1000
    set: {scenario: {nodes: 1000}}
    vary: {scenario.name: [W1, W2, W4], arm: *exp1-arms, seed: *seeds}
  # --- Exp 6 (H6): lambda sweep against upstream operating points ---------------------------------------------
  - name: exp6
    vary:
      scenario.name: [W2, W3]
      arm:
        - {name: pipeline, label: random/entropy-greedy/lambda=0.05, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 0.05}}}}
        - {name: pipeline, label: random/entropy-greedy/lambda=0.1, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 0.1}}}}
        - {name: pipeline, label: random/entropy-greedy/lambda=0.2, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 0.2}}}}
        - {name: pipeline, label: random/entropy-greedy/lambda=0.5, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 0.5}}}}
        - {name: pipeline, label: random/entropy-greedy/lambda=1, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 1}}}}
        - {name: pipeline, label: random/entropy-greedy/lambda=2, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 2}}}}
        - {name: pipeline, label: random/entropy-greedy/lambda=5, pipeline: {<<: [*common, *random], planner: {name: entropy-greedy, params: {lambda: 5}}}}
      seed: *seeds
  - name: exp6-baselines
    vary: {scenario.name: [W2, W3], arm: [*b0, *b2, *b3], seed: *seeds}
  # B5 runs under most-allocated placement (the descheduler pattern); its B0 runs under the same placement, so its
  # savings are measured against a matching reference.
  - name: exp6-b5
    set: {placement: most-allocated}
    vary: {scenario.name: [W2, W3], arm: [*b0, *b5], seed: *seeds}
  # --- Exp 5 (H5): plan fidelity by placement and scale-down model --------------------------------------------
  - name: exp5
    set: {scenario: {name: W2}}
    vary:
      placement: [least-allocated, most-allocated, plan-following]
      scaleDown: [spread, deletion-cost]
      arm: [*random-p1, *b2]
      seed: *seeds
  - name: exp5-steered
    set: {scenario: {name: W2}, placement: least-allocated}
    vary:
      scaleDown: [spread, deletion-cost]
      arm:
        - {name: pipeline, label: random/entropy-greedy/steered, pipeline: {<<: [*search, *random], potential: {name: util-entropy}, planner: *p1, executor: {name: steered, params: {mode: affinity}}}}
      seed: *seeds
  # --- Exp 3 (H3): merge-only vs merge plus shift at equal pod-eviction budgets ------------------------------
  - name: exp3
    vary:
      scenario.name: [W2, W3]
      arm:
        - {name: pipeline, label: merge-only/budget-lo, pipeline: {<<: [*common, *random-candidates], moves: [{name: random-merge, params: {confirm: true}}], planner: *p1, budgets: *budget-lo}}
        - {name: pipeline, label: merge+shift/budget-lo, pipeline: {<<: [*common, *random], planner: *p1, budgets: *budget-lo}}
        - {name: pipeline, label: merge-only/budget-hi, pipeline: {<<: [*common, *random-candidates], moves: [{name: random-merge, params: {confirm: true}}], planner: *p1, budgets: *budget-hi}}
        - {name: pipeline, label: merge+shift/budget-hi, pipeline: {<<: [*common, *random], planner: *p1, budgets: *budget-hi}}
      seed: *seeds
  # --- Exp 4 (H4): greedy vs plan-time vs online annealing -------------------------------------------------------
  - name: exp4
    vary:
      scenario.name: [W1, W4]
      arm:
        - {name: pipeline, label: entropy-greedy, pipeline: {<<: [*common, *random], planner: *p1}}
        - {name: pipeline, label: anneal-plan/t0=0.3/cooling=0.95, pipeline: {<<: [*common, *random], planner: {name: anneal-plan, params: {lambda: 0.1, t0: 0.3, cooling: 0.95, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-plan/t0=1/cooling=0.95, pipeline: {<<: [*common, *random], planner: {name: anneal-plan, params: {lambda: 0.1, t0: 1, cooling: 0.95, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-plan/t0=3/cooling=0.95, pipeline: {<<: [*common, *random], planner: {name: anneal-plan, params: {lambda: 0.1, t0: 3, cooling: 0.95, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-plan/t0=0.3/cooling=0.98, pipeline: {<<: [*common, *random], planner: {name: anneal-plan, params: {lambda: 0.1, t0: 0.3, cooling: 0.98, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-plan/t0=1/cooling=0.98, pipeline: {<<: [*common, *random], planner: {name: anneal-plan, params: {lambda: 0.1, t0: 1, cooling: 0.98, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-plan/t0=3/cooling=0.98, pipeline: {<<: [*common, *random], planner: {name: anneal-plan, params: {lambda: 0.1, t0: 3, cooling: 0.98, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-online/t0=0.3, pipeline: {<<: [*common, *random], planner: {name: anneal-online, params: {lambda: 0.1, t0: 0.3, cooling: 0.99, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-online/t0=1, pipeline: {<<: [*common, *random], planner: {name: anneal-online, params: {lambda: 0.1, t0: 1, cooling: 0.99, temperatureUnit: per-node}}}}
        - {name: pipeline, label: anneal-online/t0=3, pipeline: {<<: [*common, *random], planner: {name: anneal-online, params: {lambda: 0.1, t0: 3, cooling: 0.99, temperatureUnit: per-node}}}}
      seed: *seeds
  # --- Exp 7 (H7): decision latency vs cluster size (200 and 1,000 nodes reuse Exp 1's entropy-greedy cells) ----
  - name: exp7-n50
    set: {scenario: {name: W1, nodes: 50}}
    vary: {arm: [*b2, *heuristic-p1, *random-p1], seed: *seeds}
  - name: exp7-b2
    set: {scenario: {name: W1, nodes: 200}}
    vary: {arm: [*b2], seed: *seeds}
  # --- Ablations (figure 8) --------------------------------------------------------------------------------------
  - name: abl
    vary:
      scenario.name: [W1, W2]
      arm:
        - {name: pipeline, label: full, pipeline: {<<: [*common, *random], planner: *p2, budgets: *budget-lo}}
        - {name: pipeline, label: no-potential, pipeline: {<<: [*search, *random], executor: {name: shift-evict}, potential: {name: none}, planner: {name: anneal-plan, params: {alpha: 0, lambda: 0.1, t0: 1, cooling: 0.98, temperatureUnit: per-node}}, budgets: *budget-lo}}
        - {name: pipeline, label: no-eviction-budget, pipeline: {<<: [*common, *random], planner: *p2}}
        - {name: pipeline, label: no-annealing, pipeline: {<<: [*common, *random], planner: *p1, budgets: *budget-lo}}
        - {name: pipeline, label: no-randomness, pipeline: {<<: [*common, *heuristic], planner: *p2, budgets: *budget-lo}}
      seed: *seeds
  # --- Exp 8: optimality gap to the offline packing bound (B6) at 50 nodes ---------------------------------------
  - name: exp8
    set: {scenario: {nodes: 50}}
    vary:
      scenario.name: [W1, W2, W4]
      arm:
        - *b2
        - *b3
        - {name: pipeline, label: heuristic/savings-only, pipeline: {<<: [*common, *heuristic], planner: *p0}}
        - {name: pipeline, label: heuristic/entropy-greedy, pipeline: {<<: [*common, *heuristic], planner: *p1}}
        - {name: pipeline, label: heuristic/anneal-plan, pipeline: {<<: [*common, *heuristic], planner: *p2}}
        - {name: pipeline, label: random/savings-only, pipeline: {<<: [*common, *random], planner: *p0}}
        - {name: pipeline, label: random/entropy-greedy, pipeline: {<<: [*common, *random], planner: *p1}}
        - {name: pipeline, label: random/anneal-plan, pipeline: {<<: [*common, *random], planner: *p2}}
      seed: *seeds
  - name: exp8-b5
    set: {scenario: {nodes: 50}, placement: most-allocated}
    vary: {scenario.name: [W1, W2, W4], arm: [*b5], seed: *seeds}
  # --- B4: the pipeline with fine upstream adapters (sequential, upstream planner, upstream-queue executor, no search
  # caps), which must reproduce B2 and, under the Balanced policy, B3 (parity in the wild; B2 and B3 come from
  # exp1-baselines-n200).
  - name: b4
    vary:
      scenario.name: [W1, W2, W4]
      arm:
        - {name: pipeline, label: B4, pipeline: *b4-pipeline}
        - {name: pipeline, label: B4-balanced, policy: Balanced, pipeline: *b4-pipeline}
      seed: *seeds
  # --- Realism checks (threats to validity): Exp 1's entropy-guided cells and the upstream baselines on W5
  # (PDBs, hostname spread, anti-affinity, do-not-disrupt) and W6 (Google 2011 trace replay) at 200 nodes. Cut after
  # the 1,000-node reference groups: W6 first, then W5 (plan's cut order).
  - name: realism-w5
    set: {scenario: {name: W5}}
    vary:
      arm:
        - *b2
        - *b3
        - {name: pipeline, label: heuristic/entropy-greedy, pipeline: {<<: [*common, *heuristic], planner: *p1}}
        - {name: pipeline, label: heuristic/anneal-plan, pipeline: {<<: [*common, *heuristic], planner: *p2}}
        - {name: pipeline, label: random/entropy-greedy, pipeline: {<<: [*common, *random], planner: *p1}}
        - {name: pipeline, label: random/anneal-plan, pipeline: {<<: [*common, *random], planner: *p2}}
      seed: *seeds
  - name: realism-w6
    set: {scenario: {name: W6}}
    vary:
      arm:
        - *b2
        - *b3
        - {name: pipeline, label: heuristic/entropy-greedy, pipeline: {<<: [*common, *heuristic], planner: *p1}}
        - {name: pipeline, label: heuristic/anneal-plan, pipeline: {<<: [*common, *heuristic], planner: *p2}}
        - {name: pipeline, label: random/entropy-greedy, pipeline: {<<: [*common, *random], planner: *p1}}
        - {name: pipeline, label: random/anneal-plan, pipeline: {<<: [*common, *random], planner: *p2}}
      seed: *seeds
  # --- 1,000-node reference groups, run last and cut first: B2 latency at 1,000 nodes for H7's secondary contrast
  # (1-hour runs), then B2 and B3 reference rows beside Exp 1 at 1,000 nodes (not Exp 1 cells: no test uses them).
  - name: exp7-b2-n1000
    set: {scenario: {name: W1, nodes: 1000}, duration: 1h}
    vary: {arm: [*b2], seed: *seeds}
  - name: exp1-baselines-n1000
    set: {scenario: {nodes: 1000}}
    vary: {scenario.name: [W1, W2, W4], arm: [*b2, *b3], seed: *seeds}
